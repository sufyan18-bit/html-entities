<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities Assignment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <h1>HTML Entities Reference Page</h1>
    <p>This page demonstrates how to display reserved characters in HTML using character entities.</p>

    <table>
        <thead>
            <tr>
                <th>Character</th>
                <th>Entity Name</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>&lt;</td>
                <td>&amp;lt;</td>
                <td>Less than sign</td>
            </tr>
            <tr>
                <td>&gt;</td>
                <td>&amp;gt;</td>
                <td>Greater than sign</td>
            </tr>
            <tr>
                <td>&amp;</td>
                <td>&amp;amp;</td>
                <td>Ampersand</td>
            </tr>
            <tr>
                <td>&quot;</td>
                <td>&amp;quot;</td>
                <td>Double quotation mark</td>
            </tr>
            <tr>
                <td>&copy;</td>
                <td>&amp;copy;</td>
                <td>Copyright symbol</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
